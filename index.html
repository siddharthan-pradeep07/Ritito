<html>
<head>
    <title>Ritito</title>  
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

        .grid
        {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-columns: repeat(60, 1fr);
            grid-template-rows: repeat(30, 1fr);
            border-left: 1px solid #bdb9b9;
            border-top: 1px solid #bdb9b9;
        }
        .cell
        {
            border-right: 1px solid #bdb9b9;
            border-bottom: 1px solid #bdb9b9;
            background: #ffffff;
        }
        #textbox
        {
            position: fixed;
            top: 20px;
            left: 20px;
        }
        #textbox input
        {
            border-radius: 20px;
            padding: 0px 16px;
            text-align: start;
            border: 1.5px solid #53525277;
            width: 300px;
            height: 200px;
            font-size: 14px;
            outline: none;
            background: #a2b8b9a9;
        }
        #sidepanel
        {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 540px;
            bottom: 20px;
            border-radius: 20px;
            border: 1.5px solid #5352526e;
            background: #a2b8b9a9;
        }
    </style>
</head>
<body>
    
    <div id="sidepanel"></div>
    <div id="textbox">
        <input type="text" placeholder="Type here....">
    </div>
    <div class="grid" id="grid"></div>

    <script>
        const grid = document.getElementById('grid');
        for (let iv = 0; iv < 60*30; iv++)
         {
            const div = document.createElement('div');
            div.className = 'cell';
            grid.appendChild(div);
         }
    </script>
    </body>
</html>

<html>
<head>
    <title>Ritito</title>  

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Pirata+One&family=Sekuya&display=swap" rel="stylesheet">

    <style>
        
    * { margin: 0; padding: 0; box-sizing: border-box; }

        .grid
        {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-columns: repeat(60, 1fr);
            grid-template-rows: repeat(30, 1fr);
            border-left: 1px solid #bdb9b9;
            border-top: 1px solid #bdb9b9;
        }
        .cell
        {
            border-right: 1px solid #bdb9b9;
            border-bottom: 1px solid #bdb9b9;
            background: #ffffff;
        }
        #textbox
        {
            position: fixed;
            top: 20px;
            left: 20px;
        }
        #textbox input
        {
            border-radius: 20px;
            padding: 0px 16px;
            text-align: start;
            border: 1.5px solid #53525277;
            width: 300px;
            height: 200px;
            font-size: 14px;
            outline: none;
            background: #d1b4b4a9;
        }
        #sidepanel
        {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 1340px;
            bottom: 20px;
            border-radius: 20px;
            border: 1.5px solid #5352526e;
            background: #d1c5b4a9;
        }
        #bottompanel
        {
            position: fixed;
            top:240px;
            left: 20px;
            width: 300px;
            bottom: 20px;
            border-radius: 20px;
            border: 1.5px solid #5352526e;
            background: #d1b4b4a9;
        }
        #bottompanel p
        {
            font-size: 16px;
            padding: 12px 16px;
            color: #333333;
            border-bottom: 1px solid #53525277;
        }

    </style>
</head>
<body>
    
    <div id="sidepanel"></div>
    <div id="bottompanel">
        <p style="font-family: 'Google Sans Flex';">Be the greatest</p>
        <p style="font-family: 'Montserrat';">Be the greatest</p>
        <p style="font-family: 'Orbitron';">Be the greatest</p>
        <p style="font-family: 'Pirata One';">Be the greatest</p>
        <p style="font-family: 'Sekuya';">Be the greatest</p>

    </div>
    <div id="textbox">
        <input type="text" placeholder="Type here....">
    </div>
    <div class="grid" id="grid"></div>

    <script>
        const grid = document.getElementById('grid');
        for (let iv = 0; iv < 60*30; iv++)
         {
            const div = document.createElement('div');
            div.className = 'cell';
            grid.appendChild(div);
         }
    </script>
    </body>
</html>

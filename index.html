<html>
<head>
    <title>Ritito unfinished</title>  

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Pirata+One&family=Sekuya&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_circle_down" />

    <style>
        
    * { margin: 0; padding: 0; box-sizing: border-box; }

        .grid
        {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-columns: repeat(60, 1fr);
            grid-template-rows: repeat(30, 1fr);
            border-left: 1px solid #bdb9b9;
            border-top: 1px solid #bdb9b9;
        }
        .cell
        {
            border-right: 1px solid #bdb9b9;
            border-bottom: 1px solid #bdb9b9;
            background: #ffffff;
        }
        #textbox
        {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 18vw;
            height: 26vh;
        }
        #textbox input
        {
            border-radius: 20px;
            padding: 0px 16px;
            text-align: top;
            border: 1.5px solid #53525277;
            width: 100%;
            height: 100%;
            font-size: 14px;
            outline: none;
            background: #b4bdd1a9;
        }
        #sidepanel
        {
            position: fixed;
            top: 20px;
            right: 20px;
            left: calc(18vw + 40px);
            bottom: 20px;
            border-radius: 20px;
            border: 1.5px solid #5352526e;
            background: #c2b4d19a;
        }
        #bottompanel
        {
            position: fixed;
            top:calc(26vh + 40px);
            left: 20px;
            width: 18vw;
            bottom: 20px;
            border-radius: 20px;
            border: 1.5px solid #5352526e;
            background: #b4bdd1a9;
            padding-bottom: 12px;
        }
        #bottompanel button
        {
            font-size: 16px;
            padding: 12px 16px;
            color: #333333;
            border-bottom: 1px solid #ffffff00;
            display: block;
            width: calc(100% - 24px);
            height: auto;
            margin: 9px 12px;
            border-radius: 8px;
        }

        #printbed
        {
            width: min(85vh, 70vw);
            height: min(85vh, 70vw);
            border-radius: 10px;
            border: 2.8px solid #4d4c4caf;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #c1b4d1cc;
        }

        #bed-text
        {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(14px, 2.5vw, 40px);
            color: #000000d3;
            pointer-events: none;
            white-space: pre-wrap;
            text-align: center;
            width: 85%;
            height: 80%;
            overflow: hidden;
            word-break: break-word;
        }

        #download-panel
        {
            width: 200px;
            height: 50px;
            border-radius: 10px;
            border: 1.5px solid #53525277;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        #download-panel-button
        {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
            background: #a19edd85;
            font-size: clamp(16px, 1vw, 14px);
            font-family: Google Sans Flex, sans-serif;

            color: #222222dc;
            cursor: pointer;
        }

        #download-panel-button:hover
        {
            width: 100%;
            height: 100%;
            border: 1.5px solid #53525277;
            border-radius: 10px;
            background: #a19edd6e;
            font-size: clamp(16px, 1vw, 14px);
            font-family: Google Sans Flex, sans-serif;
            color: #222222dc;
            cursor: pointer;
        }

        #font-panel-button
        {
            width: 100%;
            height: 100%;
            border: 1.5px solid #53525277;
            border-radius: 10px;
            background: #a19edd3a;
            font-size: clamp(16px, 1vw, 14px);
            font-family: Google Sans Flex, sans-serif;

            color: #222222dc;
            cursor: pointer;
        }
        #font-panel-button:hover
        {
            background: #a19edd6e;
        }
            

    </style>
</head>
<body>
    
    <div id="sidepanel">
        <div id="printbed">
            <p id="bed-text"></p>
            <p style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 16px; color: #00000086;">Printer Bed, fonts are just placebo button</p>
        </div>
        <div id="download-panel">
            <button id="download-panel-button">Download .gcode</button>
        </div>
    </div>
    <div id="bottompanel">
        <button id="font-panel-button" style="font-family: 'Google Sans Flex';">Be the greatest</button>
        <button id="font-panel-button" style="font-family: 'Montserrat';">Be the greatest</p>
        <button id="font-panel-button" style="font-family: 'Orbitron';">Be the greatest</p>
        <button id="font-panel-button" style="font-family: 'Pirata One';">Be the greatest</p>
        <button id="font-panel-button"style="font-family: 'Sekuya';">Be the greatest</p>

    </div>
    <div id="textbox">
        <input type="text" placeholder="Type here.....">
    </div>
    <div class="grid" id="grid"></div>

    <script>
        const grid = document.getElementById('grid');
        for (let iv = 0; iv < 60*30; iv++)
         {
            const div = document.createElement('div');
            div.className = 'cell';
            grid.appendChild(div);
         }

         const input = document.querySelector('#textbox input');
         const bedText = document.getElementById('bed-text');
         
         input.addEventListener('input', () =>
        {
            bedText.textContent = input.value; 
        });

        const lettersgcode =      // Used AI to get the Gcode values for the letters and numbers. 
        {
            'A': [[[0,0],[5,10],  [10,0]], [[2,5],[8,5]]],
            'B': [[[0,0],[0,10]], [[0,0], [7,0],[9,2],[7,4],[0,4]], [[0,4],[7,4],[9,6],[7,8],[0,8],[0,10]]],
            'C': [[[9,2],[7,0],   [3,0], [1,2],[1,8],[3,10],[7,10],[9,8]]],
            'D': [[[0,0],[0,10]], [[0,0],[6,0],[9,3],[9,7],[6,10],[0,10]]],
            'E': [[[0,0],[0,10]], [[0,0],[9,0]], [[0,5],[6,5]], [[0,10],[9,10]]],
            'F': [[[0,0],[0,10]], [[0,10],[9,10]], [[0,5],[6,5]]],
            'G': [[[9,8],[7,10],  [3,10],[1,8],[1,2],[3,0],[7,0],[9,2],[9,5],[5,5]]],
            'H': [[[0,0],[0,10]], [[10,0],[10,10]], [[0,5],[10,5]]],
            'I': [[[5,0],[5,10]], [[2,0],[8,0]], [[2,10],[8,10]]],
            'J': [[[8,10],[8,2],  [6,0],[3,0],[1,2]]],
            'K': [[[0,0],[0,10]], [[9,10],[0,5],[9,0]]],
            'L': [[[0,10],[0,0]], [[0,0],[9,0]]],
            'M': [[[0,0],[0,10],  [5,4],[10,10],[10,0]]],
            'N': [[[0,0],[0,10],  [10,0],[10,10]]],
            'O': [[[3,0],[7,0],   [9,2],[9,8],[7,10],[3,10],[1,8],[1,2],[3,0]]],
            'P': [[[0,0],[0,10]], [[0,10],[7,10],[9,8],[7,6],[0,6]]],
            'Q': [[[3,0],[7,0],   [9,2],[9,8],[7,10],[3,10],[1,8],[1,2],[3,0]], [[6,4],[10,0]]],
            'R': [[[0,0],[0,10]], [[0,10],[7,10],[9,8],[7,6],[0,6]], [[5,6],[10,0]]],
            'S': [[[9,8],[7,10],  [3,10],[1,8],[3,6],[7,4],[9,2],[7,0],[3,0],[1,2]]],
            'T': [[[5,0],[5,10]], [[0,10],[10,10]]],
            'U': [[[0,10],[0,2],  [2,0],[8,0],[10,2],[10,10]]],
            'V': [[[0,10],[5,0],  [10,10]]],
            'W': [[[0,10],[2,0],  [5,6],[8,0],[10,10]]],
            'X': [[[0,10],[10,0]],[[0,0],[10,10]]],
            'Y': [[[0,10],[5,5],  [10,10]], [[5,5],[5,0]]],
            'Z': [[[0,10],[10,10],[0,0],[10,0]]],
            ' ': [],
            '.': [[[5,0],[5,1]]],
            ',': [[[5,0],[4,-1]]],
            '!': [[[5,3],[5,10]], [[5,0],[5,1]]],
            '?': [[[1,8],[3,10],[7,10],[9,8],[9,6],[5,4],[5,2]], [[5,0],[5,1]]],
            '-': [[[2,5],[8,5]]],
            '0': [[[3,0],[7,0],[9,2],[9,8],[7,10],[3,10],[1,8],[1,2],[3,0]]],
            '1': [[[3,8],[5,10],[5,0]]],
            '2': [[[1,8],[3,10],[7,10],[9,8],[9,6],[1,2],[1,0],[9,0]]],
            '3': [[[1,8],[3,10],[7,10],[9,8],[9,6],[5,5]], [[5,5],[9,4],[9,2],[7,0],[3,0],[1,2]]],
            '4': [[[7,0],[7,10],[0,4],[10,4]]],
            '5': [[[9,10],[1,10],[1,6],[7,6],[9,4],[9,2],[7,0],[3,0],[1,2]]],
            '6': [[[8,10],[3,10],[1,8],[1,2],[3,0],[7,0],[9,2],[9,4],[7,6],[1,6]]],
            '7': [[[1,10],[9,10],[3,0]]],
            '8': [[[3,5],[1,7],[1,9],[3,10],[7,10],[9,9],[9,7],[3,5],[7,5],[9,3],[9,1],[7,0],[3,0],[1,1],[1,3],[7,5]]],
            '9': [[[9,4],[1,4],[1,6],[3,8],[7,8],[9,6],[9,2],[7,0],[3,0],[1,2]]],
        };

        function generateGcode(text)
        {
            const bed_width = 220, bed_height = 220, margin = 10;
            const pen_down = 0, pen_up = 5, FEED = 3000;
            const letter_width = 12, letter_height = 14, letterScale = 1.4;
            const usableW = bed_width - margin * 2;
            const letters_per_line = Math.floor(usableW/(letter_width * letterScale));
            const chars = text.toUpperCase().split('');
            const lines = [];

            for(let i = 0; i < chars.length; i += letters_per_line)
               lines.push(chars.slice(i, i + letters_per_line));

            const totalH = lines.length * letter_height * letterScale;
            const startY = (bed_height - totalH) / 2 + margin;

            let gcode = ['G21','G90','G28',`G0 Z${pen_up} F${FEED}`,'G0 X0 Y0'];
            lines.forEach((line, lineIdx) => 
            {
                 const lineW = line.length * letter_width * letterScale;
                 const startX = (bed_width - lineW) / 2;
                 const baseY = startY + lineIdx * letter_height * letterScale;

                 line.forEach((ch, chIdx) =>
                 {
                    (lettersgcode[ch] || []).forEach(stroke => 
                    {
                        stroke.forEach((pt, ptIdx)=>
                        {
                            const x = +(startX + chIdx * letter_width * letterScale + pt[0] * letterScale).toFixed(3);
                            const y = +(baseY + pt[1] * letterScale).toFixed(3);
                            if (ptIdx === 0)
                            {
                                gcode.push(`G0 Z${pen_up} F${FEED}`,`G0 X${x} Y${y} F${FEED}`,`G0 Z${pen_down} F${FEED}`);
                            }
                            else
                            {
                                gcode.push(`G1 X${x} Y${y} F${FEED}`);
                            }
                        });
                    });
                 });
            });
            gcode.push(`G0 Z${pen_up}`,'G0 X0 Y0','M84');
            return gcode.join('\n');
        }

        document.getElementById('download-panel-button').addEventListener('click',() =>
        {
            const text = input.value.trim();
            if (!text) return;
            const blob = new Blob([generateGcode(text)], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'ritito_text.gcode';
            a.click();
        });

        document.querySelectorAll('#font-panel-button').forEach(button =>
        {
            button.addEventListener('click', () =>
            {
                bedText.style.fontFamily = button.style.fontFamily;
            });
        });

    </script>
    </body>
</html>

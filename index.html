<html>
<head>
    <title>Ritito</title>  

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Pirata+One&family=Sekuya&display=swap" rel="stylesheet">

    <style>
        
    * { margin: 0; padding: 0; box-sizing: border-box; }

        .grid
        {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-columns: repeat(60, 1fr);
            grid-template-rows: repeat(30, 1fr);
            border-left: 1px solid #bdb9b9;
            border-top: 1px solid #bdb9b9;
        }
        .cell
        {
            border-right: 1px solid #bdb9b9;
            border-bottom: 1px solid #bdb9b9;
            background: #ffffff;
        }
        #textbox
        {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 18vw;
            height: 26vh;
        }
        #textbox input
        {
            border-radius: 20px;
            padding: 0px 16px;
            text-align: top;
            border: 1.5px solid #53525277;
            width: 100%;
            height: 100%;
            font-size: 14px;
            outline: none;
            background: #b4bdd1a9;
        }
        #sidepanel
        {
            position: fixed;
            top: 20px;
            right: 20px;
            left: calc(18vw + 40px);
            bottom: 20px;
            border-radius: 20px;
            border: 1.5px solid #5352526e;
            background: #c2b4d19a;
        }
        #bottompanel
        {
            position: fixed;
            top:calc(26vh + 40px);
            left: 20px;
            width: 18vw;
            bottom: 20px;
            border-radius: 20px;
            border: 1.5px solid #5352526e;
            background: #b4bdd1a9;
        }
        #bottompanel p
        {
            font-size: 16px;
            padding: 12px 16px;
            color: #333333;
            border-bottom: 1px solid #ffffff00;
        }

        #printbed
        {
            width: min(60vh, 45vw);
            height: min(60vh, 45vw);
            border-radius: 10px;
            border: 2.8px solid #4d4c4caf;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #c1b4d1cc;
        }

        #bed-text
        {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(14px, 2.5vw, 40px);
            color: #000000d3;
            pointer-events: none;
            white-space: pre-wrap;
            text-align: center;
            width: 85%;
            word-break: break-word;
        }

        #download-panel
        {
            width: 200px;
            height: 50px;
            border-radius: 10px;
            border: 1.5px solid #53525277;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        #download-panel-button
        {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
            background: #a19edd85;
            font-size: clamp(16px, 1vw, 14px);
            font-family: Google Sans Flex, sans-serif;

            color: #222222dc;
            cursor: pointer;
        }

    </style>
</head>
<body>
    
    <div id="sidepanel">
        <div id="printbed">
            <p id="bed-text"></p>
            <p style="position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 16px; color: #00000086;">Printer Bed</p>
        </div>
        <div id="download-panel">
            <button id="download-panel-button">Download .gcode</button>
        </div>
    </div>
    <div id="bottompanel">
        <p style="font-family: 'Google Sans Flex';">Be the greatest</p>
        <p style="font-family: 'Montserrat';">Be the greatest</p>
        <p style="font-family: 'Orbitron';">Be the greatest</p>
        <p style="font-family: 'Pirata One';">Be the greatest</p>
        <p style="font-family: 'Sekuya';">Be the greatest</p>

    </div>
    <div id="textbox">
        <input type="text" placeholder="Type here....">
    </div>
    <div class="grid" id="grid"></div>

    <script>
        const grid = document.getElementById('grid');
        for (let iv = 0; iv < 60*30; iv++)
         {
            const div = document.createElement('div');
            div.className = 'cell';
            grid.appendChild(div);
         }

         const input = document.querySelector('#textbox input');
         const bedText = document.getElementById('bed-text');
         
         input.addEventListener('input', () =>
        {
            bedText.textContent = input.value; 
        });
    </script>
    </body>
</html>
